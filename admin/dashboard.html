<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — LomaShares</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../assets/js/supabase.js" defer></script>
  <script src="../assets/js/auth.js" defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'DM Sans', sans-serif !important;
      background: #050d1f !important;
      color: #e3eaff !important;
      min-height: 100vh;
    }
    body::before, body::after { display: none !important; }

    a { text-decoration: none; color: inherit; }

    /* ── Layout ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px;
      background: rgba(5,13,31,.95);
      border-bottom: 1px solid rgba(255,255,255,.07);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; color: #fff; }
    .brand span { color: #00c853; }
    .admin-badge {
      padding: 4px 10px; border-radius: 6px;
      background: rgba(239,83,80,.15); color: #ef5350;
      font-size: 11px; font-weight: 700; letter-spacing: .05em;
    }

    .main { padding: 20px 16px 80px; max-width: 600px; margin: 0 auto; }

    /* ── Section ── */
    .section { margin-bottom: 28px; }
    .section-title {
      font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,.45); text-transform: uppercase; letter-spacing: .1em;
      margin-bottom: 12px;
    }

    /* ── Card ── */
    .card {
      background: #0d1e38; border: 1px solid rgba(255,255,255,.07);
      border-radius: 18px; padding: 20px; margin-bottom: 12px;
    }

    /* ── Method switcher ── */
    .method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .method-btn {
      padding: 14px 8px; border-radius: 14px;
      border: 2px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,.5); text-align: center; cursor: pointer;
      transition: all .2s; -webkit-tap-highlight-color: transparent;
    }
    .method-btn .micon { font-size: 22px; display: block; margin-bottom: 6px; }
    .method-btn:hover { border-color: rgba(255,255,255,.2); color: #fff; }
    .method-btn.active-paystack { border-color: #00c853; background: rgba(0,200,83,.12); color: #00c853; }
    .method-btn.active-manual   { border-color: #ff9800; background: rgba(255,152,0,.12); color: #ff9800; }
    .method-btn.active-ipayng   { border-color: #2979ff; background: rgba(41,121,255,.12); color: #2979ff; }

    .method-status {
      margin-top: 12px; padding: 10px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 600; text-align: center;
    }
    .method-status.ok    { background: rgba(0,200,83,.1); color: #00c853; }
    .method-status.err   { background: rgba(239,83,80,.1); color: #ef5350; }
    .method-status.info  { background: rgba(41,121,255,.1); color: #2979ff; }

    /* ── Deposits list ── */
    .deposit-item {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 14px; padding: 16px;
      margin-bottom: 10px;
    }
    .deposit-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .deposit-user { font-size: 14px; font-weight: 700; color: #fff; }
    .deposit-time { font-size: 11px; color: rgba(255,255,255,.35); margin-top: 2px; }
    .deposit-amount {
      font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; color: #00e676;
    }
    .deposit-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .meta-chip {
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,.06); color: rgba(255,255,255,.6);
    }
    .narration-display {
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
      color: #ff9800; letter-spacing: .06em;
      background: rgba(255,152,0,.08); border-radius: 8px;
      padding: 8px 12px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .action-row { display: flex; gap: 10px; }
    .btn-approve {
      flex: 1; padding: 11px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #00c853, #00a846);
      color: #fff; font-family: 'Syne', sans-serif;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: opacity .15s;
    }
    .btn-reject {
      flex: 1; padding: 11px; border-radius: 10px; border: none;
      background: rgba(239,83,80,.15); color: #ef5350;
      font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
      cursor: pointer; border: 1px solid rgba(239,83,80,.25);
      transition: opacity .15s;
    }
    .btn-approve:disabled, .btn-reject:disabled { opacity: .4; cursor: not-allowed; }

    .empty { text-align: center; color: rgba(255,255,255,.3); padding: 32px; font-size: 14px; }

    /* ── Filter tabs ── */
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
    .filter-tab {
      flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,.1);
      background: transparent; color: rgba(255,255,255,.4);
      font-size: 12px; font-weight: 700; cursor: pointer;
      transition: all .15s;
    }
    .filter-tab.on { background: rgba(41,121,255,.2); border-color: rgba(41,121,255,.4); color: #fff; }

    /* ── Refresh btn ── */
    .refresh-btn {
      float: right; padding: 5px 12px; border-radius: 8px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.5); font-size: 12px; font-weight: 600;
      cursor: pointer; margin-top: -4px;
    }
    .refresh-btn:hover { color: #fff; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #0d1e38; border: 1px solid rgba(255,255,255,.12);
      color: #fff; padding: 12px 20px; border-radius: 12px;
      font-size: 13px; font-weight: 600; z-index: 100;
      opacity: 0; transition: opacity .25s; pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>

<body
  data-page="admin"
  data-supabase-url="https://yrrjadpzaesqxvclflwt.supabase.co"
  data-supabase-anon="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlycmphZHB6YWVzcXh2Y2xmbHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MzExMzksImV4cCI6MjA4ODQwNzEzOX0.3rwLwVdrfjLIL9o-mFldpUgEUsbEINx1GTTMUt416g4"
>

<div class="topbar">
  <div class="brand">Loma<span>Admin</span></div>
  <div class="admin-badge">ADMIN</div>
</div>

<div class="main">

  <!-- ── Deposit Method Switcher ── -->
  <div class="section">
    <div class="section-title">Active Deposit Method</div>
    <div class="card">
      <div class="method-grid">
        <div class="method-btn" id="btn-paystack" onclick="setMethod('paystack')">
          <span class="micon">💳</span>
          Paystack
        </div>
        <div class="method-btn" id="btn-manual" onclick="setMethod('manual')">
          <span class="micon">🏦</span>
          Manual
        </div>
        <div class="method-btn" id="btn-ipayng" onclick="setMethod('ipayng')">
          <span class="micon">⚡</span>
          iPayNG
        </div>
      </div>
      <div class="method-status info" id="methodStatus">Loading current method…</div>
    </div>
  </div>

  <!-- ── Manual Deposits Queue ── -->
  <div class="section">
    <div class="section-title">
      Deposit Approvals
      <button class="refresh-btn" onclick="loadDeposits()">↻ Refresh</button>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab on" data-filter="pending" onclick="switchFilter(this,'pending')">Pending</button>
      <button class="filter-tab" data-filter="completed" onclick="switchFilter(this,'completed')">Approved</button>
      <button class="filter-tab" data-filter="rejected" onclick="switchFilter(this,'rejected')">Rejected</button>
      <button class="filter-tab" data-filter="all" onclick="switchFilter(this,'all')">All</button>
    </div>

    <div id="depositsList">
      <div class="empty">Loading deposits…</div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  var adminId      = "";
  var activeFilter = "pending";

  function waitForSb(cb) {
    if (window.sb) { cb(); return; }
    var t = setInterval(function () { if (window.sb) { clearInterval(t); cb(); } }, 50);
  }

  document.addEventListener("DOMContentLoaded", function () {
    waitForSb(async function () {
      try {
        var session = await window.LomaAuth.requireAuth();
        if (!session) return;
        adminId = session.user.id;

        // Verify admin
        var { data: prof } = await window.sb.from("profiles").select("is_admin").eq("id", adminId).single();
        if (!prof?.is_admin) {
          document.body.innerHTML = "<div style='color:#ef5350;padding:40px;text-align:center;font-family:sans-serif'>⛔ Access denied. Admins only.</div>";
          return;
        }

        await loadCurrentMethod();
        await loadDeposits();

      } catch (e) { console.error(e); }
    });
  });

  /* ── Load current method ── */
  async function loadCurrentMethod() {
    try {
      var res = await fetch("/api/get-deposit-method");
      var d   = await res.json();
      highlightMethod(d.method);
      updateMethodStatus(d.method);
    } catch (e) { console.error(e); }
  }

  function highlightMethod(method) {
    ["paystack","manual","ipayng"].forEach(function (m) {
      var btn = document.getElementById("btn-" + m);
      btn.className = "method-btn" + (m === method ? " active-" + m : "");
    });
  }

  function updateMethodStatus(method) {
    var el = document.getElementById("methodStatus");
    var labels = {
      paystack: "✅ Users are paying via Paystack (card & bank transfer)",
      manual:   "🏦 Users are transferring manually to your OPay account",
      ipayng:   "⚡ Users are using iPayNG Auto-Manual flow"
    };
    el.textContent = labels[method] || "Unknown method";
    el.className   = "method-status " + (method === "manual" ? "info" : "ok");
  }

  /* ── Set method ── */
  window.setMethod = async function (method) {
    var el = document.getElementById("methodStatus");
    el.textContent = "Switching to " + method + "…";
    el.className   = "method-status info";

    try {
      var res = await fetch("/api/admin/set-deposit-method", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ method, admin_id: adminId })
      });
      var d = await res.json();

      if (d.ok) {
        highlightMethod(method);
        updateMethodStatus(method);
        toast("✅ Switched to " + method);
      } else {
        el.textContent = "❌ " + (d.error || "Failed");
        el.className   = "method-status err";
      }
    } catch (e) {
      el.textContent = "❌ Network error";
      el.className   = "method-status err";
    }
  };

  /* ── Filter ── */
  window.switchFilter = function (btn, filter) {
    document.querySelectorAll(".filter-tab").forEach(function (b) { b.classList.remove("on"); });
    btn.classList.add("on");
    activeFilter = filter;
    loadDeposits();
  };

  /* ── Load deposits ── */
  window.loadDeposits = async function () {
    var wrap = document.getElementById("depositsList");
    wrap.innerHTML = "<div class='empty'>Loading…</div>";

    try {
      var query = window.sb
        .from("deposits")
        .select("*, profiles(full_name, email, referral_code)")
        .order("created_at", { ascending: false })
        .limit(50);

      if (activeFilter !== "all") {
        query = query.eq("status", activeFilter);
      }

      var { data, error } = await query;

      if (error) throw error;

      if (!data || !data.length) {
        wrap.innerHTML = "<div class='empty'>No deposits found.</div>";
        return;
      }

      wrap.innerHTML = data.map(function (d) {
        return renderDeposit(d);
      }).join("");

    } catch (e) {
      console.error(e);
      wrap.innerHTML = "<div class='empty' style='color:#ef5350'>Failed to load deposits.</div>";
    }
  };

  function renderDeposit(d) {
    var name      = d.profiles?.full_name || "Unknown";
    var email     = d.profiles?.email     || "";
    var refCode   = d.profiles?.referral_code || "";
    var amount    = "₦" + Number(d.amount).toLocaleString();
    var method    = (d.method || d.provider || "—").toUpperCase();
    var narration = d.narration || "—";
    var status    = d.status    || "pending";
    var time      = new Date(d.created_at).toLocaleString("en-NG", { dateStyle:"medium", timeStyle:"short" });

    var statusColor = {
      pending:   "#ff9800",
      completed: "#00c853",
      rejected:  "#ef5350",
      submitted: "#2979ff",
    }[status] || "#888";

    var actionBtns = "";
    if (status === "pending" || status === "submitted") {
      actionBtns = `
        <div class="action-row">
          <button class="btn-approve" onclick="processDeposit('${d.id}','approve',this)">✅ Approve</button>
          <button class="btn-reject"  onclick="processDeposit('${d.id}','reject',this)">❌ Reject</button>
        </div>`;
    } else {
      actionBtns = `<div style="font-size:12px;color:${statusColor};font-weight:700;text-transform:uppercase">${status}</div>`;
    }

    return `
      <div class="deposit-item" id="dep-${d.id}">
        <div class="deposit-header">
          <div>
            <div class="deposit-user">${name}</div>
            <div class="deposit-time">${email} · ${time}</div>
          </div>
          <div class="deposit-amount">${amount}</div>
        </div>
        <div class="deposit-meta">
          <span class="meta-chip">${method}</span>
          <span class="meta-chip">Ref: ${(d.reference||"").slice(0,18)}…</span>
          ${refCode ? '<span class="meta-chip">Code: ' + refCode + '</span>' : ""}
          <span class="meta-chip" style="color:${statusColor}">${status.toUpperCase()}</span>
        </div>
        ${narration !== "—" ? `
          <div class="narration-display">
            <span>Narration: ${narration}</span>
            <button class="cpbtn" style="background:rgba(255,152,0,.15);color:#ff9800;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer" onclick="copyText('${narration}')">COPY</button>
          </div>` : ""}
        ${actionBtns}
      </div>`;
  }

  /* ── Process deposit ── */
  window.processDeposit = async function (depositId, action, btn) {
    var row   = btn.closest(".action-row");
    var allBtns = row.querySelectorAll("button");
    allBtns.forEach(function (b) { b.disabled = true; });
    btn.textContent = action === "approve" ? "Approving…" : "Rejecting…";

    try {
      var res = await fetch("/api/admin/process-manual-deposit", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ deposit_id: depositId, action, admin_id: adminId })
      });
      var d = await res.json();

      if (d.ok) {
        toast(action === "approve" ? "✅ Deposit approved & wallet credited!" : "❌ Deposit rejected.");
        // Refresh list after short delay
        setTimeout(loadDeposits, 800);
      } else {
        toast("Error: " + (d.error || "Unknown error"));
        allBtns.forEach(function (b) { b.disabled = false; });
        btn.textContent = action === "approve" ? "✅ Approve" : "❌ Reject";
      }
    } catch (e) {
      console.error(e);
      toast("Network error. Try again.");
      allBtns.forEach(function (b) { b.disabled = false; });
    }
  };

  /* ── Copy ── */
  window.copyText = function (text) {
    navigator.clipboard.writeText(text).then(function () { toast("Copied!"); });
  };

  /* ── Toast ── */
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(function () { el.classList.remove("show"); }, 2800);
  }

})();
</script>

</body>
</html>
